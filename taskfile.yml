# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']

dotenv: ['.env']

vars:
  MISE_SHIMS: "{{.HOME}}/.local/share/mise/shims"
  ZIG_GLOBAL_CACHE_DIR: "{{.ROOT_DIR}}/.cache/zig"

env:
  # mise-shimmed binaries must win over a stale system PATH entry.
  PATH: "{{.MISE_SHIMS}}:{{.PATH}}"
  ZIG_GLOBAL_CACHE_DIR: "{{.ZIG_GLOBAL_CACHE_DIR}}"
  HOMEBREW_NO_ASK: "1"

includes:
  ci: taskfiles/ci.yml
  assets: taskfiles/assets.yml
  core: taskfiles/core.yml
  dosbox-x: taskfiles/dosbox-x.yml
  extension: taskfiles/extension.yml
  game: taskfiles/game.yml
  legacy: taskfiles/legacy.yml
  release: taskfiles/release.yml
  screensaver: taskfiles/screensaver.yml

tasks:
  default:
    desc: "Default task"
    cmds:
      - task --list

  submodules:
    desc: "Fetch git submodules (third_party/godot-cpp) if any aren't checked out yet"
    summary: |
      Fetches every git submodule this repo vendors (currently just
      third_party/godot-cpp, TASK-004) via `git submodule update --init
      --recursive`. Idempotent: skipped if every submodule is already
      checked out.

      Example:
        task submodules
    cmds:
      - git submodule update --init --recursive
    status:
      - test -z "$(git submodule status | grep '^-')"

  deps:
    desc: "Fetch/install every prerequisite any build in this repo needs: git submodules plus every platform's _install-* toolchain step"
    summary: |
      Meta task aggregating every prerequisite-fetching task in the
      repo -- git submodules, and every internal `_install-*` task
      (SDL 1.2 for the legacy oracle build, an objcopy-compatible tool
      for core:build-abi on macOS, DOSBox-X for testing custom levels)
      -- so a fresh clone only needs one
      command before anything else builds. Each is idempotent and
      platform-gated already, so this is safe to run unconditionally
      on any OS: non-matching platform steps are silently skipped, and
      already-satisfied ones are no-ops. New prerequisite tasks get
      added here as another `task:` entry, not folded into this task's
      own cmds.

      Example:
        task deps
    cmds:
      - task: submodules
      - task: core:_install-macos-objcopy
      - task: ci:_install-linux-deps
      - task: ci:_install-macos-deps
      - task: dosbox-x:_install-linux-dosbox-x
      - task: dosbox-x:_install-macos-dosbox-x

  check:
    desc: "The one documented build/test command: the Godot build's boundary/test gates and the asset pipeline's reproducibility gates (TASK-015.05 -- the legacy SDL build is no longer part of the default gate, see `task legacy:build`)"
    summary: |
      Runs every reproducibility/test gate that's portable across CI
      platforms: the asset pipeline's checks, the Godot build's
      simulation-boundary check, and its full test suite. Does NOT
      build or run the legacy SDL binary (see `task legacy:build`).
      It does build the GDExtension shim for the current platform
      (via game:test -> game:import -> extension:build), since the
      test suite exercises native classes (e.g. SimWorld.OK).

      Example:
        task check
    cmds:
      - task: assets:check
      - task: game:boundary-check
      - task: game:test

  run:
    desc: "Build everything the Godot build needs (submodule, core ABI, GDExtension shim for the current platform) and launch the game -- the one-shot way to just play it"
    summary: |
      The one-shot way to go from a clean clone to a playable game:
      fetches git submodules, builds core/'s C ABI, builds the
      GDExtension shim for the current platform, then launches Godot.
      Each step is idempotent, so re-running this after the first time
      only rebuilds what actually changed.

      Example:
        task run
    cmds:
      - task: extension:build
      - task: game:run
