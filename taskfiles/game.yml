# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

# TASK-014: the Godot 4.7.1 project under game/.

tasks:
  run:
    desc: "Run the Godot build (TASK-015.05): the primary way to play Jump'n'Bump"
    cmds:
      - godot --path game

  import:
    desc: "Headless Godot import of the game/ project (TASK-009's export-macos needs the .godot/ import cache populated first)"
    summary: |
      task game:import

      Depends on the GDExtension shim being built first: without it,
      the reimport pass itself throws GDExtension dynamic-library-not-
      found errors for every script that references a native class
      (e.g. presentation/main.gd's JumpnbumpAssetLoader).
    deps:
      - ":extension:build"
    cmds:
      # --frame-delay 800 + a retry loop: a coldstart --import with a
      # GDExtension that registers classes (ours does) hits a confirmed
      # Godot engine race (godotengine/godot#111048, #111645, fix pending
      # in #123658): EditorHelp queues a deferred _gen_extensions_docs()
      # callback that can still be in flight when Main::cleanup() tears
      # down its target, crashing with SIGSEGV (exit 134) on a null `doc`
      # pointer. --frame-delay gives that callback time to flush before
      # cleanup runs, cutting the crash rate a lot (10/10 clean locally
      # vs. ~30-50% without it) but it's a timing mitigation, not a fix --
      # upstream's own PR notes call it a workaround, and it still crashed
      # once on the real macOS CI runner even with the flag. Retrying is
      # the only fully reliable option short of shipping a patched Godot.
      - |
        for i in 1 2 3; do
          godot --headless --frame-delay 800 --path game --import && exit 0
          echo "game:import attempt $i/3 crashed (see godotengine/godot#111048); retrying..." >&2
        done
        exit 1

  bootstrap:
    desc: "Install gdUnit4, the Tier-D test framework (checksum-verified download, TASK-014.07)"
    cmds:
      - uv run tools/bootstrap.py game gdunit4

  boundary-check:
    desc: "Fail if any script outside game/simulation/ references JumpnbumpWorld (TASK-014.01)"
    cmds:
      - uv run tools/validate_game_boundary.py

  test:
    desc: "Run the game/tests/ suite headlessly through gdUnit4 (TASK-014.07)"
    summary: |
      task game:test

      Non-zero exit on any failing test case (gdUnit4's own CI exit codes,
      not a wrapper-imposed one). Also runs the pre-gdUnit4 standalone
      smoke scripts (test_tick_driver.gd and friends, TASK-014.02-.06) via
      `godot --headless --script`, since those predate gdUnit4 and still
      carry real coverage. Depends on bootstrap too: CI never ran it on
      its own, so gdUnit4's own GdUnitCmdTool.gd was never present for
      the final cmd below to load.
    deps:
      - import
      - bootstrap
    cmds:
      - godot --headless --path game --script res://tests/test_tick_driver.gd
      - godot --headless --path game --script res://tests/test_sprite_geometry.gd
      - godot --headless --path game --script res://tests/test_level_layers.gd
      - godot --headless --path game --script res://tests/test_text_geometry.gd
      - godot --headless --path game --script res://tests/test_audio.gd
      - godot --headless --path game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests --ignoreHeadlessMode

  capture:
    desc: "Capture real-rendered screenshots of the title/menu/level-picker/gameplay screens under headless sway (TASK-016.02 follow-up)"
    summary: |
      task game:capture -- [output_dir]

      Renders the Godot build at title/menu/level_picker/level_picker_error/
      gameplay_builtin/gameplay_custom states under a headless sway
      compositor (sway+grim, see tools/capture_level_picker.sh and
      main.gd's --capture-state= debug hook), writing PNGs to output_dir
      (default artifacts/level_picker/) for a human to eyeball -- headless
      gdUnit4 proves scene construction and signal wiring but not actual
      rendering.

      Deliberately NOT part of `task check` -- judgment-matched visual
      verification, not an automated pixel-diff gate. Requires sway, grim,
      and a resolved godot binary on PATH; Linux + Wayland only.
    platforms: [linux]
    cmds:
      - ./tools/capture_level_picker.sh {{.CLI_ARGS}}
