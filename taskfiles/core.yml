# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

# TASK-012: builds core/'s C ABI, linked by taskfiles/extension.yml.

tasks:
  _install-macos-objcopy:
    internal: true
    desc: "Install an objcopy-compatible tool (TASK-012.02's localize_abi_symbols.py) via Homebrew"
    platforms: [darwin]
    cmds:
      - brew install llvm
    status:
      - command -v objcopy >/dev/null 2>&1 || command -v llvm-objcopy >/dev/null 2>&1 || command -v gobjcopy >/dev/null 2>&1 || test -x "$(brew --prefix llvm 2>/dev/null)/bin/llvm-objcopy"

  build-abi:
    desc: "Build core/zig-out/lib/libjumpnbump.a (core/abi.zig's frozen jnb_* symbol surface)"
    summary: |
      Runs `zig build abi` from core/, producing the static library that
      extension:build links into the GDExtension shim. Freshness-checked
      via sources/generates: skipped if no core/**/*.zig file changed
      since the last build. On macOS, pulls in an objcopy-compatible
      tool via Homebrew first (not part of Xcode/Command Line Tools).

      Example:
        task core:build-abi
    deps: ["_install-macos-objcopy"]
    dir: core
    cmds:
      - zig build abi
    sources:
      - "**/*.zig"
    generates:
      - zig-out/lib/libjumpnbump.a
